e:"جوال نور",style:"screen",summary:"مكالمة فيديو من ١٦:٤٧ إلى ١٧:٣١ (٤٤ دقيقة) مع «مركز توثيق». كانت في كرسي الحديقة.",body:["مكالمة فيديو — مركز التوثيق","البدء ١٦:٤٧","الانتهاء ١٧:٣١","المدة ٤٤ دقيقة"]},{id:"e_nur_saw",title:"سعيد أمام نور",kind:"testimony",where:"إفادة نور",summary:"طوال مكالمتها (١٦:٤٧–١٧:٣١) كان سعيد أمامها في الحوش يروّح على الفحم، ثم حمل الجمر إلى المجلس."},{id:"e_transit",title:"الصندوق في الطريق",kind:"testimony",where:"إفادة سعيد",summary:"من البيت القديم إلى الفيلا كان الصندوق مربوطاً في حوض الونيت، وسعيد ويوسف معاً في المقصورة. ثم استلمه الجد ونور عند الباب حتى ١٦:٤٥."},{id:"e_hosh_talk",title:"طلال وسعيد في الحوش",kind:"testimony",where:"إفادة طلال وسعيد",summary:"من ١٦:٤٥ حتى خروج طلال ١٧:١٠ كان طلال وسعيد يتحدثان في الحوش عن مصير البيت القديم."},{id:"e_live",title:"بث يوسف المباشر",kind:"digital",where:"حساب يوسف",style:"screen",summary:"بث مباشر متصل من الملحق: ١٦:٤٦–١٧:٣٤، وجهه في الكاميرا طوال الوقت.",body:["🔴 بث مباشر — «الليلة نفتح صندوق جدي»","البدء ١٦:٤٦ · الانتهاء ١٧:٣٤","المدة ٤٨ دقيقة · بلا انقطاع"]},{id:"e_photo1",title:"صورة يوسف الأولى (١٥:٥٢)",kind:"photo",where:"جوال يوسف",summary:"الصندوق في مخزن البيت القديم قبل تحميله: الغبار يغطي مسامير القاعدة كلها، وخط الدرج مستوٍ."},{id:"e_photo2",title:"صورة يوسف الثانية (١٧:٣٨)",kind:"photo",where:"جوال يوسف",mini:"photodiff",summary:"الصندوق في مكتب الجد. قارنوها بالصورة الأولى."},{id:"e_photodiff",title:"نتيجة المقارنة",kind:"object",where:"تحليل الصورتين",summary:"بين ١٥:٥٢ و١٧:٣٨ مُسح الغبار عن أحد المسامير وعليه أثر أبيض، وبرز الدرج قليلاً، وظهر ملف على المكتب. الدرج فُتح بين الصورتين — لا قبل الأولى ولا بعد الثانية."},{id:"e_yusuf_saw",title:"سالم دخل وخرج",kind:"testimony",where:"إفادة يوسف",summary:"نحو ١٧:٣٦ رأى يوسف أباه يدخل المكتب بملف ويخرج «في أقل من دقيقة». فدخل بعده وصوّر."},{id:"e_salim_denies",title:"«المكتب؟ ما دخلته»",kind:"testimony",where:"إفادة سالم",summary:"سالم ينكر أنه دخل مكتب الجد."},{id:"e_salim_admits",title:"سالم يعترف بالملف",kind:"testimony",where:"إفادة سالم",summary:"سالم دخل المكتب دقيقة ليترك مسودة مخالصة يعرضها على الضيف «بهدوء». علم بالأمانة من ورقة عند خاله حامد. لم يلمس الصندوق."},{id:"e_overheard",title:"مكالمة سالم",kind:"testimony",where:"إفادة يوسف",summary:"سمع يوسف أباه يقول في الهاتف: «لازم ما ينفتح الموضوع الليلة»."},{id:"e_daftar",title:"الدفتر في المقعد",kind:"object",where:"البيت القديم",summary:"دفتر الأمانات على مكتب المؤسس، ملفوفاً بفوطة مطبخ مقلّمة بالأحمر — من طقم الفيلا."},{id:"e_dust",title:"آثار في الغبار",kind:"object",where:"البيت القديم",summary:"خط واحد من آثار نعل حديثة: من الباب إلى المكتب ثم العودة. لا صعود للدرج ولا تفتيش. من جاء وضع شيئاً وانصرف."},{id:"e_entry47",title:"القيد رقم ٤٧",kind:"doc",where:"دفتر الأمانات",style:"ledger",summary:"أمانة الحاج عبد الرحيم الجاوي: ١٢٠ جنيهاً ذهباً، صيف ١٩٥٤م. وبهامشه بحبر آخر اعتراف المؤسس بأنه صرفها في بضاعة الشاي وأنها دَين في ذمته.",body:["٤٧ — ٥ ذي القعدة ١٣٧٣","أمانة الحاج عبد الرحيم بن زين الجاوي من أهل سُرَبايا: مئة وعشرون جنيهاً ذهباً، يستلمها بعد الحج بنصف الوصل.","— بالهامش، بحبر أزرق —","توفي صاحبها بمكة ولم يحضر وارث. صرفتُها في بضاعة الشاي بعد غرق السنبوك. هي دَين في ذمتي وذمة ورثتي حتى تُرَدّ.","كتبنا إلى سُرَبايا مرتين ولم يأتِ جواب."]},{id:"e_half_shop",title:"نصف الوصل (في الدفتر)",kind:"doc",where:"دفتر الأمانات",style:"paper",summary:"نصف ورقة مشقوقة طولياً ملصق عند القيد ٤٧. حافته متعرجة وكلماته مبتورة.",body:["استلمنا من الحاج عبد الر…","مئة وعشر…","تُرَدّ لحامل النص…"]},{id:"e_margin",title:"ورقة العم عبد الله",kind:"doc",where:"مخزن البيت القديم",style:"letter",summary:"ورقة بخط العم عبد الله (شخصية خيالية) مؤرخة ١٣٧٥هـ: أخوه سأله عن وديعة تصرّف فيها، فأجابه أن المتصرف في الوديعة بغير إذن ضامن لها.",body:["مكة، ربيع الأول ١٣٧٥","سألني أخي سالم عن وديعةٍ تصرّف فيها المودَع عنده بغير إذن صاحبها لضرورةٍ نزلت به.","فكتبتُ له ما يقرره الفقهاء: أنه بذلك ضامنٌ لها، يردّها أو بدلها متى وجد صاحبها أو ورثته.","وقلت له: اكتبها على نفسك وأشهِد."]},{id:"e_fawzi_half",title:"نصف الوصل (بيد فوزي)",kind:"doc",where:"السيد فوزي",style:"paper",summary:"نصف ورقة قديمة ورثها فوزي عن جده، حافتها متعرجة.",body:["…حيم الجاوي أمانةً","…ين جنيهاً ذهباً","…ف الآخر. سالم باوزير"]},{id:"e_match",title:"النصفان يتطابقان",kind:"doc",where:"مطابقة",style:"paper",summary:"نصف فوزي يكمل نصف الدفتر حرفاً بحرف. فوزي حفيد صاحب الأمانة رقم ٤٧.",body:["استلمنا من الحاج عبد الرحيم الجاوي أمانةً","مئة وعشرين جنيهاً ذهباً","تُرَدّ لحامل النصف الآخر. سالم باوزير"]},{id:"e_omar_knew",title:"الجد كان يعلم",kind:"testimony",where:"إفادة الجد",summary:"الجد يعرف بالأمانة منذ وفاة أبيه. وجده فوزي قبل أسبوعين، فدعاه الليلة ليُقرأ القيد أمام الجميع وتُرَدّ الأمانة."},{id:"e_hamed_paper",title:"ورقة الإشهاد (١٣٧٥هـ)",kind:"doc",where:"أوراق حامد",style:"letter",summary:"بخط حسن المرجاني جار المؤسس: يشهد أن سالماً أقرّ عنده بدَين الأمانة وتعهد بردّها مع ثلث ربح أول صفقة.",body:["محرم ١٣٧٥","أشهد أنا حسن المرجاني أن جاري سالم بن عوض باوزير أقرّ عندي أن في ذمته أمانة الحاج الجاوي، وأنه يردّها ومعها ثلث ربح أول صفقة شاي متى ظهر وارثها.","وكتبنا هذه من نسختين."]},{id:"e_letters",title:"رسالتان مرتجعتان",kind:"doc",where:"أرشيف نور",style:"letter",summary:"رسالتان من المؤسس إلى سورابايا (١٩٥٦ و١٩٥٨) عادتا بختم «العنوان غير معروف». حاول فعلاً أن يجد الورثة.",body:["إلى ورثة الحاج عبد الرحيم بن زين — سُرَبايا","لكم عندنا أمانة محفوظة، فمن حضر منكم بنصف الوصل فهي له.","[ختم بريدي: مرتجع — العنوان غير معروف — ١٩٥٦]","[الرسالة الثانية: مرتجع — ١٩٥٨]"]},{id:"e_invoice",title:"أول فاتورة شاي",kind:"doc",where:"مكتب المؤسسة",style:"ledger",summary:"فاتورة أول شحنة شاي: ربيع الآخر ١٣٧٤، قيمتها ١١٨ جنيهاً ذهباً — تكاد تساوي الأمانة.",body:["ربيع الآخر ١٣٧٤","شاي — ٤٠ صندوقاً","القيمة: مئة وثمانية عشر جنيهاً ذهباً","دُفعت نقداً"]},{id:"e_sign",title:"لوحة الدكان",kind:"object",where:"سوق العلوي",summary:"«سالم عوض باوزير — عطارة · شاهي · صرافة — تُحفظ الأمانات». حفظ ودائع الحجاج كان جزءاً من عمل الدكان."},{id:"e_omar_memory",title:"رواية الجد",kind:"testimony",where:"إفادة الجد",summary:"يتذكر عمر (وعمره ١٢): «أبويا خسر كل شي يوم غرق السنبوك، ثم ربنا فتح عليه بالشاي». رواية فخر."},{id:"e_khadija_memory",title:"رواية خديجة",kind:"testimony",where:"إفادة خديجة",summary:"تتذكر خديجة (وعمرها ٧): أمها تبكي وأبوها يقول «مال الناس نار». رواية خجل. وتقول: «أسرار البيوت ما تنقال قدام الغريب»."},{id:"e_saeed_trip",title:"رحلة سعيد",kind:"testimony",where:"إفادة سعيد",summary:"سعيد يقول إنه خرج ١٨:٠٦ إلى البيت القديم «ليقفل الشبابيك قبل التسليم» وعاد ١٩:٢٢."},{id:"e_saeed_bundle",title:"أمانة سعيد",kind:"testimony",where:"إفادة سعيد",summary:"سعيد حمل صرّة ملفوفة سُلّمت له عند باب المطبخ الخلفي نحو السادسة، مع وصية: «أمانة، حطّها على مكتب البيت القديم ولا تفتحها». لم يفتحها ولم يعرف ما فيها. وعد ألا يسمّي من سلّمها."},{id:"k_samovar",title:"شاهي السماور",kind:"card",where:"بطاقة معرفية",summary:"عادة حضرمية يحافظ عليها الجد: يُغسل الشاي في البرّاد ويُترك فوق فوهة السماور «ليرسخ»، ثم «يُكرَّس» (يُصبّ ويُعاد)، ثم يُكمل الفنجان بماء السماور. والفاصل بين فنجان وآخر يسمى «الصبّة». في بيت باوزير تُقدَّم معه قهوة ومعمول من بيت المرجاني."},{id:"k_sword",title:"«كسر السيف»",kind:"card",where:"بطاقة معرفية",summary:"يردد الجد: «أهلنا يُروى أنهم كسروا السيف؛ نُصلح ولا نتخاصم». يشير إلى ما يُروى في تقليد آل باعلوي بحضرموت عن الإمام الفقيه المقدَّم محمد بن علي (ت ٦٥٣هـ) من ترك حمل السلاح والانصراف إلى العلم والإصلاح. هو خبر تتناقله كتب المناقب المتأخرة، ويُفهم رمزاً أو حقيقة، ولا يصح تعميمه على كل الحضارم. في هذا البيت صار مَثَلاً يفسّره كلٌّ على هواه: هل الصلح كتمان أم مصارحة؟"},{id:"k_bakhmari",title:"الباخمري",kind:"card",where:"بطاقة معرفية",summary:"عجين مخمَّر يُقلى، غالباً على شكل مثلثات، بحبة البركة. يُعرف في جدة بالخمير، وفي حضرموت بالباخمري. يحتاج العجين وقتاً ليرتاح قبل القلي."},{id:"k_amana",title:"لوحة المقعد",kind:"card",where:"بطاقة معرفية",summary:"فوق مكتب المؤسس: ﴿إِنَّ اللَّهَ يَأْمُرُكُمْ أَن تُؤَدُّوا الْأَمَانَاتِ إِلَىٰ أَهْلِهَا﴾ (النساء: ٥٨). كان الحجاج يودعون أموالهم عند تجار جدة وصرّافيها قبل الصعود إلى مكة."},{id:"k_house",title:"بيت البلد",kind:"card",where:"بطاقة معرفية",summary:"بيوت جدة التاريخية مبنية بالحجر المنقبي البحري، تتخلله على مسافات منتظمة عوارض خشبية أفقية (تكاليل)، وواجهاتها رواشين خشبية للتهوية والظل والستر. سور جدة أُزيل سنة ١٩٤٧م، وانتقلت أسر كثيرة إلى الأحياء الجديدة في السبعينيات والثمانينيات."}],dialogue:[{id:"o1",who:"omar",q:"ماذا كان في الصندوق، ومتى أُغلق؟",a:"دفتر أبويا والظرف. أنا بيدي حطّيتهم سنة ثمانية وستين يوم مات الله يرحمه، وختمته بخاتمه، ومن يومها ما انفتح. الدفتر كان فيه، هذا أحلف عليه.",gives:["e_sealed68"]},{id:"o2",who:"omar",q:"من معه مفتاح الصندوق؟",a:"المفتاح في سلسلتي ما فارقني. والنسخة الثانية ضاعت من أيام البلد.",gives:["e_keys"]},{id:"o3",who:"omar",q:"أين كنت بعد وصول الصندوق؟",a:"استلمته أنا ونور عند الباب وحطّيناه في المكتب. ومن خمسة إلا ربع وأنا في المجلس أجهّز البخاري وريم معي أعلّمها: نغسل الشاهي، نخلّيه يرسخ، ونكرّسه. ما قامت إلا دقيقتين تجيب علب السكر.",gives:["e_samovar","e_transit"]},{id:"o4",who:"omar",q:"ما معنى قولك «كسروا السيف»؟",a:"كلمة ورثناها. أهلنا يُروى أنهم كسروا السيف؛ يعني نُصلح ولا نتخاصم. بس الصلح يا ولدي له وجهين، والليلة بانشوف أي وجه.",gives:["k_sword"]},{id:"o5",who:"omar",q:"لماذا دعوت السيد فوزي الليلة؟",unlock:{ev:["e_fawzi_half"]},a:"أبويا قبل ما يموت قال لي: في الدفتر أمانة لحاج جاوي ما رجعت. ستين سنة وأنا أقول بكرة. قبل أسبوعين جاني هذا الرجل بنص ورقة… فقلت: الليلة ينقرأ القيد قدام الكل، ونوفّي.",gives:["e_omar_knew"]},{id:"o6",who:"omar",q:"(قيد ٤٧) ماذا تتذكر عن تلك السنة؟",present:"e_entry47",a:"كان عمري اثنعش. السنبوك غرق ببضاعة أبويا كلها. خسر كل شي، ثم ربنا فتح عليه بالشاي. كذا كنت أحكيها لعيالي… وأسكت عن الباقي.",gives:["e_omar_memory"]},{id:"o7",who:"omar",q:"(الدرج الخفي) هل كنت تعرف هذا الدرج؟",present:"e_drawer",a:"الدرج أعرفه، درج للأختام والحبر. بس إن القاع يرتفع من تحت؟ والله أول مرة أدري. أنا كنت في الدكان، مو في البيت."},{id:"k1",who:"khadija",q:"أين كنتِ من العصر؟",a:"في المطبخ يا بنتي، من العصر. ما فارقت العجين لين قليته بعد المغرب.",gives:["e_khadija_claim"]},{id:"k2",who:"khadija",q:"ماذا تتذكرين عن الصندوق في أيام البلد؟",a:{normal:"أيام البلد… كان أبويا يجلّسني جنبه في المقعد، ويطلّع لي حلاوة من الصندوق وهو مقفول! ويضحك: «الصندوق له باب ما يعرفه إلا أهله».",expert:"أيام البلد… كان أبويا يطلّع لي منه حلاوة. كنت صغيرة، ما أذكر كيف."},gives:["e_anecdote"]},{id:"k3",who:"khadija",q:"ما رأيك في ضيف أخيك؟",a:"ضيف أخويا على العين والراس. بس أسرار البيوت ما تنقال قدام الغريب، ولا قدام العيال."},{id:"k4",who:"khadija",q:"(شهادة ريم) ريم وجدت المطبخ خالياً.",present:"e_kitchen_empty",a:"خالي؟… إيوه، رحت أتوضأ. دقيقتين. إيش فيها؟",gives:["e_khadija_wudu"]},{id:"k5",who:"khadija",q:"(الفوطة الرابعة) أين الفوطة الرابعة؟",present:"e_towels",a:"الفوط؟ يمكن وحدة في الغسيل. أنا إيش يدريني."},{id:"k6",who:"khadija",q:"(قيد ٤٧) ماذا تتذكرين عن تلك السنة؟",present:"e_entry47",a:"كان عمري سبع. أذكر أمي تبكي في المبيت، وأبويا يقول: «مال الناس نار». أخويا يحكيها حكاية فتح ورزق. أنا أذكرها غير.",gives:["e_khadija_memory"]},{id:"s1",who:"salim",q:"أين كنت قبل المغرب؟",a:"جيت من الشركة قبل المغرب بثلث ساعة، طلعت غيّرت ثوبي ونزلت المجلس. المكتب؟ ما دخلته.",gives:["e_salim_denies"]},{id:"s2",who:"salim",q:"ما رأيك في فتح الدفتر أمام الجميع؟",a:"السمعة رأس المال. اللي في الدفاتر القديمة يُعالَج بهدوء، مو في مجلس."},{id:"s3",who:"salim",q:"(الملف) هذا الملف لك؟",present:"e_folder",a:"طيب. دخلت دقيقة وحطّيته على المكتب. خالي حامد ورّاني ورقة أبوه الأسبوع الماضي، فعرفت إن فيه أمانة قديمة. كنت أبغى أعرض على الضيف مخالصة بهدوء. الصندوق ما لمسته.",gives:["e_salim_admits"]},{id:"s4",who:"salim",q:"(المكالمة) مع من كنت تتكلم؟",present:"e_overheard",a:"مع مستشار الشراكة. إيوه، قلت «لا ينفتح الليلة»: طلبت من أبويا يأجّل فتح الصندوق لبعد التوقيع، وما رضي. هذا كل شي."},{id:"n1",who:"nur",q:"أين كنتِ بعد وصول الصندوق؟",a:"استلمته مع أبي ووضعناه في المكتب. ثم جلست في كرسي الحديقة فوراً لمكالمة عمل حتى الخامسة والنصف تقريباً، ودخلت المجلس. هذا سجل المكالمة.",gives:["e_nur_call"]},{id:"n2",who:"nur",q:"هل رأيتِ أحداً وأنتِ في الحديقة؟",a:"العم سعيد. طوال المكالمة وهو أمامي يروّح على الفحم، ثم حمل الجمر إلى المجلس. وطلال كان معه في البداية ثم خرج بسيارته.",gives:["e_nur_saw"]},{id:"n3",who:"nur",q:"(المكالمة) مع من كانت؟",present:"e_nur_call",a:"مع مركز توثيق. وعدتهم بنسخة من أرشيف العائلة… قبل أن أستأذن أبي، نعم. لكن لو أخذتُ الدفتر لصوّرته وأعدته، لا أخفيته."},{id:"n4",who:"nur",q:"هل في أرشيفك ما يخص هذه الأمانة؟",unlock:{ev:["e_entry47"]},a:"صوّرتُ من أوراق البيت القديم رسالتين لم أفهم سياقهما حتى الآن: مرسلتان إلى سورابايا وعادتا.",gives:["e_letters"]},{id:"t1",who:"talal",q:"أين كنت؟",a:"كنت في الحوش مع عم سعيد نتكلم عن البيت القديم، وبعدين رحت أجيب المندي ورجعت. بس.",gives:["e_hosh_talk"]},{id:"t2",who:"talal",q:"(فاتورة المندي) المطعم قريب، فأين كنت ٥٢ دقيقة؟",present:"e_mandi",a:"يا جماعة… طيب. مرّيت على وسيط. فيه مشتري للبيت القديم لو تأخر التسليم. شوفوا الرسالة. بس الدفتر والله ما لي فيه، أنا أصلاً ما كنت في البيت.",gives:["e_talal_msg"]},{id:"h1",who:"hala",q:"متى وصلتِ؟",a:"جيت من المشغل مع أخويا حامد، دخلنا قبل ستة بعشر دقايق. اسألوا البوابة."},{id:"h2",who:"hala",q:"هل تعرفين شيئاً عن هذا الصندوق؟",a:"ستّي الله يرحمها كانت تقول: جارنا الحضرمي عنده صندوق «يتنفّس من تحت»؛ يطلّع منه وهو مقفول. كنا نحسبها حكاية.",gives:["e_hala_tale"]},{id:"y1",who:"yusuf",q:"أين كنت بعد ما جبتوا الصندوق؟",a:"في الملحق، كنت لايف ثلاثة أرباع الساعة. شوفوا، محفوظ في الحساب.",gives:["e_live"]},{id:"y2",who:"yusuf",q:"هل صوّرت الصندوق؟",a:"صورة وحدة في البيت القديم قبل ما نشيله. للستوري. جدي قال لا تصوّر في المكتب.",gives:["e_photo1"]},{id:"y3",who:"yusuf",q:"هل سمعت شيئاً غريباً اليوم؟",a:"سمعت أبويا في التلفون يقول: «لازم ما ينفتح الموضوع الليلة». ما فهمت إيش يقصد.",gives:["e_overheard"]},{id:"y4",who:"yusuf",q:"(الملف) هل دخلت المكتب؟",present:"e_folder",a:"أوكي أوكي. بعد اللايف شفت أبويا داخل المكتب بملف وطالع في أقل من دقيقة. قلت أشوف. دخلت وصوّرت الصندوق… خمسة وثمانية وثلاثين. لا تقولوا لجدي.",gives:["e_photo2","e_yusuf_saw"]},{id:"y5",who:"yusuf",q:"لماذا «يوسف وزير» بلا «با»؟",a:"أسهل في البراند. بس الليلة حسّيت إن الاسم وراه حكاية أكبر مني."},{id:"r1",who:"reem",q:"ماذا فعلتِ بعد العصر؟",a:"عجنت مع عمتي خديجة من أربعة وثلث لين خمسة إلا ثلث وغطّينا العجين. بعدين رحت لجدي أتعلم البخاري. والقلي بدأ بعد أذان المغرب على طول.",gives:["e_dough"]},{id:"r2",who:"reem",q:"هل غادرتِ المجلس؟",a:"مرة وحدة، خمسة وعشر تقريباً. رحت المطبخ أجيب علب السكر. العجين مغطّى وما في أحد! أخذتها ورجعت في دقيقتين.",gives:["e_kitchen_empty"]},{id:"r3",who:"reem",q:"من دخل المجلس قبل المغرب؟",a:"عم سعيد جاب الجمر، وعمتي نور دخلت بعده بشوي. وبس. جدي ما قام من مكانه."},{id:"sa1",who:"saeed",q:"كيف نُقل الصندوق؟",a:"شلناه أنا ويوسف من المخزن، وربطته في حوض الونيت بيدي. يوسف جنبي في الغمارة يصوّر طول الطريق. وصلنا واستلمه عمي عمر والدكتورة عند الباب.",gives:["e_transit"]},{id:"sa2",who:"saeed",q:"وأين كنت بعدها؟",a:"في الحوش. طلال يهرج معي عن البيت القديم لين مشى، وأنا على الفحم. بعدين دخّلت الجمر المجلس.",gives:["e_hosh_talk"]},{id:"sa3",who:"saeed",q:"(سجل البوابة) لماذا خرجت ١٨:٠٦؟",present:"e_gatelog",a:"رحت البيت القديم أقفّل الشبابيك قبل التسليم. المفاتيح ذي. إن بغيتوا تشوفوا روحوا.",gives:["e_saeed_trip"]},{id:"sa4",who:"saeed",q:"(الدفتر في المقعد) من وضع هذه الصرّة هنا؟",present:"e_daftar",a:{easy:"أنا حطّيتها. عطتني إياها عند باب المطبخ وقالت: «أمانة يا سعيد، حطّها على مكتب البيت القديم ولا تفتحها». ما فتحتها ولا دريت إيش فيها. ووعدتها ما أسمّيها.",normal:"أنا حطّيتها. واحد من أهل البيت عطاني إياها عند باب المطبخ وقال: «أمانة، حطّها على مكتب البيت القديم ولا تفتحها». ما فتحتها ولا دريت إيش فيها. ووعدت ما أسمّي.",expert:"أنا حطّيتها. أمانة انعطت لي وقيل لي لا تفتحها، وما فتحتها. من عطاني؟ وعدت ما أقول، والوعد دَين."},gives:["e_saeed_bundle"]},{id:"sa5",who:"saeed",q:"حدّثنا عن نفسك.",a:"جيت من دوعن ولد. عمي عمر كفلني وعلّمني، أربعين سنة. اللي يأمنّي على شي ما أخونه، حيّا بكم."},{id:"ha1",who:"hamed",q:"متى وصلت؟",a:"وصلت مع أختي هالة قبل السادسة بعشر دقائق، وجلسنا في المجلس مباشرة."},{id:"ha2",who:"hamed",q:"(الملف) هل صغتَ هذه المسودة؟",present:"e_folder",a:"صغتها بطلب سالم. وأصلها ورقة وجدتها في أوراق والدي، بخطه. هذه هي.",gives:["e_hamed_paper"]},{id:"ha3",who:"hamed",q:"(قيد ٤٧) هل لهذا القيد أثر
